name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Validate Python source
        run: python -m py_compile app.py
      - name: Build application
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "THAN Quiz Assistant" --icon "than_quiz.ico" --add-data "brand_logo.png;." --collect-all pyautogui --collect-all pytesseract --collect-all pymupdf --collect-all fitz app.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: THAN-Quiz-Assistant-v1.0.5-Windows
          path: dist/THAN Quiz Assistant.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish public Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v1.0.5'
          Copy-Item 'dist/THAN Quiz Assistant.exe' 'dist/THAN-Quiz-Assistant.exe' -Force
          $asset = 'dist/THAN-Quiz-Assistant.exe'
          $notes = 'THAN Quiz Assistant for Windows. OCR and PDF question matching. Developed by Chi Than Bui. Download the EXE below. Windows may show an unsigned-app warning.'
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo ${{ github.repository }}
          } else {
            gh release create $tag $asset --target ${{ github.sha }} --title 'THAN Quiz Assistant v1.0.5' --notes $notes --repo ${{ github.repository }}
          }
