name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build application
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "THAN Quiz Assistant" --icon "than_quiz.ico" --add-data "brand_logo.png;." --collect-all pyautogui --collect-all pytesseract --collect-all pymupdf --collect-all fitz app.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: THAN-Quiz-Assistant-v1.0.1-Windows
          path: dist/THAN Quiz Assistant.exe
          if-no-files-found: error
          retention-days: 30
